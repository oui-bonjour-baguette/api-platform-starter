; ── Général ──────────────────────────────
display_errors = On
error_reporting = E_ALL
log_errors = On

; ── Performance ──────────────────────────
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 20M

; ── Xdebug ───────────────────────────────
[xdebug]
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
