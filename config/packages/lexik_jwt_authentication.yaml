lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl:   '%env(int:JWT_TTL)%'

    # Cookie-only : le JWT n'est jamais accepté via l'en-tête Authorization.
    # Le cookie est posé par App\Security\JwtCookieSubscriber sur AUTHENTICATION_SUCCESS.
    token_extractors:
        authorization_header:
            enabled: false
        query_parameter:
            enabled: false
        cookie:
            enabled: true
            name: '%env(JWT_COOKIE_NAME)%'
